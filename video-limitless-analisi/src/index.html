<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMITLESS — Analisi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- Scena: tutto ciò che sta qui dentro subisce lo zoom camera 100→104% -->
    <div id="camera">
      <div id="bg"></div>
      <svg id="globe-svg" class="layer" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
      <svg id="lines-svg" class="layer" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
      <div id="pins" class="layer"></div>
      <div id="coverage-ui" class="layer"></div>
      <div id="metrics" class="layer"></div>
      <div id="callouts" class="layer"></div>

      <div id="subject">
        <div id="frame">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <i class="tick t"></i><i class="tick b"></i><i class="tick l"></i><i class="tick r"></i>
          <div id="reticle"></div>
        </div>
        <div id="wordmark-wrap">
          <div id="wordmark" class="wordmark"></div>
          <div id="wordmark-scan" class="wordmark" aria-hidden="true"></div>
        </div>
        <div id="subject-tag" class="mono label"></div>
        <div id="subject-match" class="mono label"></div>
        <div id="subject-cat" class="mono label"></div>
      </div>

      <div id="scanline"><i></i></div>
      <div id="cta"></div>
    </div>

    <!-- HUD: interfaccia fissa, non zoomata (parallasse rispetto alla scena) -->
    <div id="hud">
      <i class="hud-corner c1"></i><i class="hud-corner c2"></i><i class="hud-corner c3"></i><i class="hud-corner c4"></i>
      <div id="hud-title" class="mono label"></div>
      <div id="hud-time" class="mono label"><b class="dot"></b><span>T+00:00.00</span></div>
      <div id="hud-section" class="mono label"></div>
      <div id="hud-progress"><i></i></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="../content.js"></script>
<script src="globe-data.js"></script>
<script src="main.js"></script>
</body>
</html>
